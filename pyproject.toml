[project]
name = "shriteq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.9.2",
    "ecos>=2.0.14",
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "osqp>=1.1.3",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "pvlib>=0.15.2",
    "stable-baselines3>=2.9.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.59.2",
    "torch>=2.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
