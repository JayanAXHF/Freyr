[package]
name = "tui_viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
qrcode = "0.14.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = { version = "3.3.0", features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
memmap2 = "0.9"

# NOTE: the Raspberry Pi cross-linker lives in .cargo/config.toml, not here — a
# bare `linker` key in Cargo.toml is ignored by Cargo ("unused manifest key").
